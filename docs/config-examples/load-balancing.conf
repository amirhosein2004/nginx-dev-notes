# Load Balancing Configuration Example

# Define upstream group of servers
upstream backend {
    # Basic round-robin load balancing
    server 192.168.1.101:8080;
    server 192.168.1.102:8080;
    server 192.168.1.103:8080;
    
    # With weights (server1 gets 3x more traffic than others)
    # server 192.168.1.101:8080 weight=3;
    # server 192.168.1.102:8080;
    # server 192.168.1.103:8080;
    
    # Least connections method
    # least_conn;
    
    # IP Hash for session persistence
    # ip_hash;
    
    # Generic Hash for consistent routing
    # hash $request_uri consistent;
    
    # Backup server - used when others are unavailable
    # server 192.168.1.104:8080 backup;
    
    # Mark server as down
    # server 192.168.1.105:8080 down;
    
    # Health check and connection limiting
    # server 192.168.1.101:8080 max_fails=3 fail_timeout=30s;
    
    # Keep connections alive
    keepalive 32;
}

server {
    listen 80;
    server_name example.com;
    
    location / {
        # Pass the request to the backend servers
        proxy_pass http://backend;
        
        # Set proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        
        # WebSocket support
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
} 